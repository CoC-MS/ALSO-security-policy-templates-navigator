name: Feature or policy request
description: Suggest a Navigator improvement, license or platform coverage, or policy repository listing.
title: "[Request]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing an idea that could help partners and administrators find suitable security policy templates.

        Use this form for Navigator capabilities or repository listings. Request new deployable policies or scripts in the relevant policy repository instead.
        Keep examples generic. Do not include customer information, tenant IDs, credentials, tokens, certificates, sensitive logs or screenshots, confidential licensing agreements, or non-public pricing.
  - type: dropdown
    id: request-category
    attributes:
      label: Request category
      description: Select the type of request.
      options:
        - New policy repository listing
        - Additional license or add-on support
        - Additional platform or solution support
        - Search or filtering improvement
        - License or platform selection improvement
        - Repository metadata or template count improvement
        - Layout or accessibility improvement
        - Improvement to existing content
        - Integration request
        - Other
    validations:
      required: true
  - type: input
    id: solution-area
    attributes:
      label: Platform or solution area
      description: Identify the platform or solution involved, or "Navigator-wide".
      placeholder: "Example: Windows 11, Conditional Access, Purview, or Navigator-wide"
    validations:
      required: true
  - type: textarea
    id: business-problem
    attributes:
      label: Business or customer problem
      description: Describe the general problem without identifying a customer or tenant.
      placeholder: "Example: Partners need to find repositories matching several topic keywords."
    validations:
      required: true
  - type: textarea
    id: proposed-capability
    attributes:
      label: Proposed capability or repository listing
      description: Explain the Navigator behavior or content you would like added or changed. Include a public repository URL for a listing request.
      placeholder: "Example: Allow filtering the repository overview by multiple topic keywords."
    validations:
      required: true
  - type: input
    id: intended-users
    attributes:
      label: Intended users
      description: Identify who would use this, such as partners, security consultants, or administrators.
      placeholder: "Example: Microsoft partners comparing security template coverage"
    validations:
      required: true
  - type: input
    id: license-dependency
    attributes:
      label: Microsoft licenses or technical dependencies
      description: List known public license and add-on prerequisites, browser requirements, or other dependencies, if any.
      placeholder: "Example: Microsoft 365 Business Premium + Defender Suite"
  - type: textarea
    id: example-use-case
    attributes:
      label: Example use case
      description: Provide a realistic, sanitized example of how the request would be used.
      placeholder: "Example: A consultant selects several licenses, then filters eligible repositories by topic."
    validations:
      required: true
  - type: textarea
    id: expected-outcome
    attributes:
      label: Expected outcome
      description: Describe the result or benefit that would make this request successful.
      placeholder: "Example: The guide shows only repositories matching the selected licenses, platforms, and search criteria."
    validations:
      required: true
  - type: textarea
    id: conflicts-security-considerations
    attributes:
      label: Potential conflicts or security considerations
      description: Note possible licensing ambiguity, misleading eligibility, privacy concerns, or effects on existing guide behavior. Write "None known" if none are known. Do not disclose vulnerabilities here.
      placeholder: "Example: The guide should not imply that selecting a license guarantees every linked policy is applicable."
    validations:
      required: true
  - type: dropdown
    id: contribution-interest
    attributes:
      label: Willingness to help test or contribute
      description: Let maintainers know how you can help.
      options:
        - I can test the Navigator in a browser
        - I can contribute documentation or mapping references
        - I can contribute code or validation
        - I can provide feedback only
    validations:
      required: true
  - type: checkboxes
    id: sensitive-data-confirmation
    attributes:
      label: Sensitive data confirmation
      options:
        - label: This request contains no credentials, secrets, customer information, tenant identifiers, access tokens, certificates, sensitive logs or screenshots, confidential licensing agreements, or non-public pricing information.
          required: true
  - type: checkboxes
    id: existing-issues-confirmation
    attributes:
      label: Existing issues confirmation
      options:
        - label: I reviewed existing issues and did not find a matching request.
          required: true
